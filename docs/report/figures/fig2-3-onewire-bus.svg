  <text x="800" y="590" text-anchor="middle" font-size="18" fill="#475569">เซนเซอร์ทุกตัวต่อขนานบนสายสัญญาณ DQ เส้นเดียว แยกกันด้วยหมายเลข ROM 64 บิตที่ไม่ซ้ำกัน (ตัวอย่างค่า)</text>
  <text x="800" y="618" text-anchor="middle" font-size="17" fill="#6b7280">เฟิร์มแวร์จับคู่ ROM กับตำแหน่ง T1..T9 แล้วเก็บไว้ใน NVS จึงเปลี่ยนเซนเซอร์เสียได้โดยตำแหน่งข้อมูลไม่เปลี่ยน</text>

  <text x="800" y="80" text-anchor="middle" font-size="20" fill="#6b7280">บัส 1-Wire: ESP32 เป็น Master, DS18B20 ทั้ง 9 ตัวเป็น Slave</text>
