<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720" font-family="Leelawadee UI, Segoe UI, Tahoma, sans-serif" font-size="22" fill="#1f2937">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker>
  </defs>
  <rect width="1600" height="720" fill="#ffffff"/>

  <!-- zones -->
  <rect x="40" y="90" width="380" height="540" rx="16" fill="#fef2f2" stroke="#fecaca"/>
  <text x="230" y="128" text-anchor="middle" font-size="20" fill="#991b1b">ฝั่งไฟแรงสูง 220 V</text>
  <rect x="440" y="90" width="1120" height="540" rx="16" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="1000" y="128" text-anchor="middle" font-size="20" fill="#475569">ฝั่งสัญญาณต่ำ 3.3 V</text>
  <line x1="430" y1="150" x2="430" y2="640" stroke="#dc2626" stroke-width="3" stroke-dasharray="10 8"/>
  <text x="430" y="680" text-anchor="middle" font-size="17" fill="#991b1b">แนวแยกทางไฟฟ้า (Galvanic isolation) ผ่านหม้อแปลงทั้งสองตัว</text>

  <!-- mains lines -->
  <text x="70" y="235" font-size="20" font-weight="600" fill="#991b1b">L</text>
  <line x1="100" y1="228" x2="310" y2="228" stroke="#dc2626" stroke-width="3"/>
  <text x="70" y="315" font-size="20" font-weight="600" fill="#991b1b">N</text>
  <line x1="100" y1="308" x2="310" y2="308" stroke="#1f2937" stroke-width="3"/>

  <!-- ZMPT straddles the isolation line -->
  <rect x="310" y="190" width="240" height="150" rx="12" fill="#ffffff" stroke="#ea580c" stroke-width="2"/>
  <text x="430" y="230" text-anchor="middle" font-weight="600" fill="#9a3412">ZMPT107-1</text>
  <text x="430" y="258" text-anchor="middle" font-size="18" fill="#475569">หม้อแปลงแรงดันขนาดเล็ก</text>
  <text x="430" y="286" text-anchor="middle" font-size="17" fill="#6b7280">220 V  ->  สัญญาณ mV</text>
  <text x="430" y="314" text-anchor="middle" font-size="17" fill="#6b7280">วัดแรงดัน (V)</text>

  <!-- load wire and CT straddling the line -->
  <text x="70" y="475" font-size="20" font-weight="600" fill="#991b1b">L</text>
  <line x1="100" y1="468" x2="430" y2="468" stroke="#dc2626" stroke-width="3"/>
  <circle cx="430" cy="468" r="7" fill="#dc2626"/>
  <text x="230" y="545" font-size="17" text-anchor="middle" fill="#991b1b">สายไฟไปยังโหลดร้อยผ่านช่อง CT</text>
  <circle cx="430" cy="468" r="48" fill="none" stroke="#ea580c" stroke-width="6"/>
  <text x="430" y="400" text-anchor="middle" font-weight="600" fill="#9a3412">CT 2000:1</text>

  <!-- CT secondary -> burden -> BL0942 -->
  <path d="M478 468 H560 V583 H600" stroke="#475569" stroke-width="2" fill="none"/>
  <text x="572" y="528" font-size="15" fill="#6b7280">ขดลวดทุติยภูมิ</text>
  <rect x="600" y="560" width="150" height="46" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="675" y="589" text-anchor="middle" font-size="17">Burden 1 + 1 ohm</text>
  <text x="675" y="628" text-anchor="middle" font-size="15" fill="#6b7280">กระแส  ->  แรงดัน (วัดกระแส I)</text>
  <path d="M750 583 H790 V470 H820" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  <text x="770" y="457" font-size="15" text-anchor="middle" fill="#6b7280">IP/IN</text>

  <!-- ZMPT -> BL0942 -->
  <path d="M550 265 H820" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
  <text x="690" y="252" font-size="15" text-anchor="middle" fill="#6b7280">VP</text>

  <!-- BL0942 -->
  <rect x="820" y="190" width="380" height="340" rx="14" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="1010" y="232" text-anchor="middle" font-size="28" font-weight="600" fill="#9a3412">BL0942</text>
  <rect x="845" y="255" width="150" height="56" rx="8" fill="#ffffff" stroke="#fdba74"/>
  <text x="920" y="279" text-anchor="middle" font-size="17">ADC แรงดัน</text>
  <text x="920" y="300" text-anchor="middle" font-size="15" fill="#6b7280">24 บิต</text>
  <rect x="845" y="440" width="150" height="56" rx="8" fill="#ffffff" stroke="#fdba74"/>
  <text x="920" y="464" text-anchor="middle" font-size="17">ADC กระแส</text>
  <text x="920" y="485" text-anchor="middle" font-size="15" fill="#6b7280">24 บิต</text>
  <rect x="1025" y="300" width="150" height="150" rx="8" fill="#ffffff" stroke="#fdba74"/>
  <text x="1100" y="335" text-anchor="middle" font-size="17" font-weight="600">หน่วยคำนวณ</text>
  <text x="1100" y="365" text-anchor="middle" font-size="16" fill="#475569">V rms, I rms</text>
  <text x="1100" y="390" text-anchor="middle" font-size="16" fill="#475569">P (วัตต์), Hz</text>
  <text x="1100" y="415" text-anchor="middle" font-size="16" fill="#475569">พลังงานสะสม</text>
  <text x="1100" y="438" text-anchor="middle" font-size="15" fill="#6b7280">+ Checksum</text>
  <path d="M995 283 H1025 V340" stroke="#475569" stroke-width="1.5" fill="none"/>
  <path d="M995 468 H1025 V420" stroke="#475569" stroke-width="1.5" fill="none"/>
  <text x="1010" y="515" text-anchor="middle" font-size="16" fill="#6b7280">A1 = A2 = HIGH  ->  Address 3</text>

  <!-- UART -->
  <path d="M1200 350 H1300" stroke="#475569" stroke-width="2" marker-end="url(#ar)" marker-start="url(#ar)"/>
  <text x="1250" y="330" text-anchor="middle" font-size="18" font-weight="600">UART</text>
  <text x="1250" y="382" text-anchor="middle" font-size="15" fill="#6b7280">4800 bps</text>

  <!-- ESP32 -->
  <rect x="1300" y="230" width="240" height="260" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="1420" y="275" text-anchor="middle" font-size="28" font-weight="600" fill="#1e3a8a">ESP32</text>
  <text x="1420" y="303" text-anchor="middle" font-size="16" fill="#475569">UART2: GPIO16 RX, GPIO17 TX</text>
  <text x="1420" y="350" text-anchor="middle" font-size="16">1. ส่งคำสั่งอ่านทะเบียน</text>
  <text x="1420" y="380" text-anchor="middle" font-size="16">2. รับข้อมูล + ตรวจ Checksum</text>
  <text x="1420" y="410" text-anchor="middle" font-size="16">3. คูณค่าสอบเทียบ</text>
  <text x="1420" y="440" text-anchor="middle" font-size="16">4. ส่งต่อเว็บ / MQTT</text>
</svg>
