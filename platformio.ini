; ESP32 + BL0942 (energy metering) + 9x DS18B20 (temperature) project
;
; Two firmware variants, selected as separate PlatformIO environments:
;   serial_monitor  -> examples/01: reads all sensors, prints a table to Serial
;   web_dashboard    -> examples/02: same reads + a live Wi-Fi web dashboard
;
; Build one:      pio run -e serial_monitor
; Upload one:      pio run -e serial_monitor -t upload
; Open a monitor:  pio device monitor -e serial_monitor
;
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = serial_monitor, web_dashboard

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, colorize
upload_speed = 921600
build_flags =
    -D CORE_DEBUG_LEVEL=0
lib_deps =
    paulstoffregen/OneWire @ ^2.3.8
    milesburton/DallasTemperature @ ^3.11.0

; ---------------------------------------------------------------------------
; Example 1: read BL0942 + 9x DS18B20, print a formatted table to Serial only
; ---------------------------------------------------------------------------
[env:serial_monitor]
build_src_filter =
    -<*>
    +<01_serial_monitor/*>

; ---------------------------------------------------------------------------
; Example 2: same sensor reads + async Wi-Fi web dashboard (SSE live push)
; ---------------------------------------------------------------------------
[env:web_dashboard]
build_src_filter =
    -<*>
    +<02_web_dashboard/*>
lib_deps =
    ${env.lib_deps}
    ESP32Async/ESPAsyncWebServer @ ^3.12.0
    ESP32Async/AsyncTCP @ ^3.5.0
    bblanchon/ArduinoJson @ ^7.2.0
